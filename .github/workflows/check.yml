name: Test
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: node --test tests/*.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check lib/merge.mjs
          node --check lib/scan-utils.mjs
          node --check lib/ocr-preprocess.mjs
          node --check lib/capture-utils.mjs
          node --check lib/media-guard.mjs
          node --check lib/visual-overlap.mjs
          node --check lib/discord-structure.mjs
